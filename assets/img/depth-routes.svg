<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Two routes from images to 3D</title><desc id="desc">Multi-view fusion and single-depth estimation produce a 3D body representation through different intermediate steps.</desc><rect width="900" height="330" fill="#f7f5ef"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="45" width="180" height="75" rx="14" fill="#d9eeea"/><text x="125" y="90" font-size="20" font-weight="700">Multiple views</text><rect x="35" y="205" width="180" height="75" rx="14" fill="#fff0e9"/><text x="125" y="250" font-size="20" font-weight="700">One depth map</text><rect x="300" y="45" width="220" height="75" rx="14" fill="#f8edc3"/><text x="410" y="90" font-size="18">calibrate + fuse</text><rect x="300" y="205" width="220" height="75" rx="14" fill="#f8edc3"/><text x="410" y="250" font-size="18">retrieve + refine</text><rect x="605" y="125" width="250" height="80" rx="14" fill="#d9eeea"/><text x="730" y="158" font-size="20" font-weight="700">3D body model</text><text x="730" y="184" font-size="15">pose · surface · labels</text><path d="M220 82h70M220 242h70M525 82L600 150M525 242L600 180" stroke="#e46f50" stroke-width="4" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#e46f50"/></marker></defs></svg>
